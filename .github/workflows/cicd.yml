name: Angular CI/CD
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Crear lockfile si falta
        run: npm install --package-lock-only --ignore-scripts
      - name: Configurar cache npm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar tests con cobertura
        run: npm test -- --watch=false
      - name: Compilar Angular
        run: npx ng build --base-href "/${{ github.event.repository.name }}/"
      - name: Subir artefacto Pages
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/practica4/browser
      - name: Guardar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage
          if-no-files-found: ignore
          retention-days: 7
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
